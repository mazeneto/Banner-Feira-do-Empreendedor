<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Feira do Empreendedor 2026 - Hero</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800;900&display=swap');

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    font-family:'Figtree', Arial, sans-serif;
    background:#0b0b0b;
  }

  /* canvas com a MESMA proporção do FUNDO_FEIRA.png (4273 x 1190) */
  .hero{
    position:relative;
    width:100%;
    max-width:1920px;
    margin:0 auto;
    aspect-ratio: 4273 / 1190;
    overflow:hidden;
    background-image:url('assets/FUNDO_FEIRA.png');
    background-size:cover;
    background-position:center;
  }

  /* ===== LINHAS DE VELOCIDADE — várias fileiras, alturas diferentes,
     espalhadas por todo o banner, sempre correndo pra direita ===== */
  .speed-lines{
    position:absolute;
    inset:0;
    z-index:1;
    pointer-events:none;
  }

  .speed-row{
    position:absolute;
    left:0;
    width:100%;
    overflow:hidden;
  }

  .speed-track{
    height:100%;
    display:flex;
    align-items:center;
    width:max-content;
    animation-name: speed-run;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }

  .speed-track img{
    height:100%;
    width:auto;
    flex-shrink:0;
  }

  @keyframes speed-run{
    from{ transform:translateX(-50%); }
    to{ transform:translateX(0%); }
  }

  .speed-row.r1{ top:2%;  height:9%;  opacity:.16; }
  .speed-row.r2{ top:14%; height:7%;  opacity:.22; }
  .speed-row.r3{ top:26%; height:12%; opacity:.14; }
  .speed-row.r4{ top:42%; height:8%;  opacity:.20; }
  .speed-row.r5{ top:56%; height:11%; opacity:.15; }
  .speed-row.r6{ top:72%; height:7%;  opacity:.22; }
  .speed-row.r7{ top:84%; height:9%;  opacity:.18; }
  .speed-row.r8{ top:94%; height:6%;  opacity:.20; }

  .speed-row.r1 .speed-track{ animation-duration:5.6s; }
  .speed-row.r2 .speed-track{ animation-duration:4.3s; }
  .speed-row.r3 .speed-track{ animation-duration:6.8s; }
  .speed-row.r4 .speed-track{ animation-duration:5s; }
  .speed-row.r5 .speed-track{ animation-duration:6.1s; }
  .speed-row.r6 .speed-track{ animation-duration:4.6s; }
  .speed-row.r7 .speed-track{ animation-duration:5.4s; }
  .speed-row.r8 .speed-track{ animation-duration:4.9s; }

  .speed-row.r1 .speed-track img{ margin-right:6vw; }
  .speed-row.r2 .speed-track img{ margin-right:4vw; }
  .speed-row.r3 .speed-track img{ margin-right:8vw; }
  .speed-row.r4 .speed-track img{ margin-right:5vw; }
  .speed-row.r5 .speed-track img{ margin-right:7vw; }
  .speed-row.r6 .speed-track img{ margin-right:4.5vw; }
  .speed-row.r7 .speed-track img{ margin-right:6vw; }
  .speed-row.r8 .speed-track img{ margin-right:4vw; }

  /* ===== LOGO ===== */
  .logo{
    position:absolute;
    top:6%;
    left:4%;
    height:16%;
    z-index:6;
  }
  .logo img{ height:100%; width:auto; display:block; }

  /* ===== TEXTO (imagem pronta, já com a data) — menor, dimensionado
     pela ALTURA do hero (é a medida curta nesse formato panorâmico) ===== */
  .headline-img{
    position:absolute;
    left:4%;
    top:24%;
    height:36%;
    z-index:5;
  }
  .headline-img img{ height:100%; width:auto; display:block; }

  /* ===== CTA logo abaixo do texto ===== */
  .cta{
    position:absolute;
    left:4%;
    top:63%;
    z-index:5;
    display:inline-flex;
    align-items:center;
    gap:.6em;
    text-decoration:none;
    color:#fff;
    font-family:'Figtree', Arial, sans-serif;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.5px;
    font-size:clamp(.85rem, 1.7vw, 1.35rem);
  }

  .cta .arrow{
    display:inline-block;
    font-size:1.2em;
    animation: cta-nudge 1.1s ease-in-out infinite;
  }

  @keyframes cta-nudge{
    0%, 100%{ transform:translateX(0); }
    50%{ transform:translateX(8px); }
  }

  .cta:hover{ text-decoration:underline; }

  /* ===== CAMADA DE PESSOAS (troca sempre pra direita) ===== */
  .people-layer{
    position:absolute;
    right:0;
    bottom:0;
    width:55%;
    height:100%;
    z-index:4;
  }

  .people-layer img{
    position:absolute;
    right:0;
    bottom:0;
    height:100%;
    width:auto;
    display:block;
    transform:translateX(0);
    opacity:1;
    transition:transform .8s cubic-bezier(.62,.05,.32,1), opacity .5s ease;
  }

  /* estado antes de entrar: fora de cena, à esquerda */
  .people-layer img.is-hidden-left{
    transform:translateX(-25%);
    opacity:0;
    pointer-events:none;
  }
  /* estado ao sair: fora de cena, à direita */
  .people-layer img.is-hidden-right{
    transform:translateX(25%);
    opacity:0;
    pointer-events:none;
  }

  @media (max-width:720px){
    .headline-img{ height:30%; top:20%; }
    .logo{ height:11%; }
    .cta{ top:54%; font-size:.75rem; }
    .people-layer{ width:65%; }
  }
</style>

</div>

<script>
  const HOLD_MS = 5000;
  const imgs = Array.from(document.querySelectorAll('#peopleLayer img'));
  let current = 0;

  function goTo(nextIndex){
    const curEl = imgs[current];
    const nextEl = imgs[nextIndex];

    // pessoa atual sai pela direita
    curEl.classList.remove('active');
    curEl.classList.add('is-hidden-right');

    // prepara a próxima do lado esquerdo (sem transição) e entra
    nextEl.classList.remove('is-hidden-right');
    nextEl.style.transition = 'none';
    nextEl.classList.add('is-hidden-left');

    requestAnimationFrame(() => {
      nextEl.style.transition = '';
      nextEl.classList.remove('is-hidden-left');
      nextEl.classList.add('active');
    });

    current = nextIndex;
  }

  function cycle(){
    setTimeout(() => {
      const next = (current + 1) % imgs.length;
      goTo(next);
      cycle();
    }, HOLD_MS);
  }

  cycle();
</script>
