<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Feira do Empreendedor 2026 - Hero</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800;900&display=swap');

  *{ box-sizing:border-box; margin:0; padding:0; }

  body{
    font-family:'Figtree', Arial, sans-serif;
    background:#0b0b0b;
  }

  /* canvas com a MESMA proporção do FUNDO_FEIRA.png (4273 x 1190) */
  .hero{
    position:relative;
    width:100%;
    max-width:1920px;
    margin:0 auto;
    aspect-ratio: 4273 / 1190;
    overflow:hidden;
    background-image:url('assets/FUNDO_FEIRA.png');
    background-size:cover;
    background-position:center;
  }

  /* ===== LINHAS DE VELOCIDADE — fileiras em alturas aleatórias,
     por todo o banner, correndo pra direita ===== */
  .speed-lines{
    position:absolute;
    inset:0;
    z-index:1;
    pointer-events:none;
  }

  .speed-row{
    position:absolute;
    left:0;
    width:100%;
    overflow:hidden;
  }

  .speed-track{
    height:100%;
    display:flex;
    align-items:center;
    width:max-content;
    animation-name: speed-run;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }

  .speed-track img{
    height:100%;
    width:auto;
    flex-shrink:0;
  }

  @keyframes speed-run{
    from{ transform:translateX(-50%); }
    to{ transform:translateX(0%); }
  }

  /* alturas "aleatórias" espalhadas por todo o banner, tamanho em vw
     (fixo e previsível — não depende de cadeia de % de altura) */
  .speed-row.r1{ top:6%;  height:4.6vw; opacity:.75; }
  .speed-row.r2{ top:24%; height:3.2vw; opacity:.85; }
  .speed-row.r3{ top:46%; height:5.6vw; opacity:.65; }
  .speed-row.r4{ top:68%; height:3.6vw; opacity:.8; }
  .speed-row.r5{ top:87%; height:4.2vw; opacity:.7; }

  .speed-row.r1 .speed-track{ animation-duration:6.2s; }
  .speed-row.r2 .speed-track{ animation-duration:4.4s; }
  .speed-row.r3 .speed-track{ animation-duration:7.6s; }
  .speed-row.r4 .speed-track{ animation-duration:5.2s; }
  .speed-row.r5 .speed-track{ animation-duration:6.8s; }

  .speed-row.r1 .speed-track img{ margin-right:8vw; }
  .speed-row.r2 .speed-track img{ margin-right:6vw; }
  .speed-row.r3 .speed-track img{ margin-right:10vw; }
  .speed-row.r4 .speed-track img{ margin-right:7vw; }
  .speed-row.r5 .speed-track img{ margin-right:9vw; }

  /* ===== BLOCO DE CONTEÚDO (logo + texto + CTA) — maior, centralizado
     verticalmente e deslocado pra perto da imagem que troca, sempre
     com alinhamento à esquerda ===== */
  .content-block{
    position:absolute;
    left:20%;
    top:50%;
    transform:translateY(-50%);
    z-index:5;
    display:flex;
    flex-direction:column;
    align-items:flex-start;
    gap:1.3vw;
  }

  .logo{ height:7vw; }
  .logo img{ height:100%; width:auto; display:block; }

  .headline-img{ height:12.5vw; }
  .headline-img img{ height:100%; width:auto; display:block; }

  .cta{
    display:inline-flex;
    align-items:center;
    gap:.5em;
    text-decoration:none;
    color:#fff;
    font-family:'Figtree', Arial, sans-serif;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:.3px;
    font-size:clamp(.75rem, 1.15vw, 1.05rem);
    white-space:nowrap;
  }

  .cta .arrow{
    display:inline-block;
    font-size:1.2em;
    animation: cta-nudge 1.1s ease-in-out infinite;
  }

  @keyframes cta-nudge{
    0%, 100%{ transform:translateX(0); }
    50%{ transform:translateX(8px); }
  }

  .cta:hover{ text-decoration:underline; }

  /* ===== CAMADA DE PESSOAS (troca sempre pra direita) ===== */
  .people-layer{
    position:absolute;
    right:0;
    bottom:0;
    width:55%;
    height:100%;
    z-index:4;
  }

  .people-layer img{
    position:absolute;
    right:0;
    bottom:0;
    height:100%;
    width:auto;
    display:block;
    transform:translateX(0);
    opacity:1;
    transition:transform .8s cubic-bezier(.62,.05,.32,1), opacity .5s ease;
  }

  /* estado antes de entrar: fora de cena, à esquerda */
  .people-layer img.is-hidden-left{
    transform:translateX(-25%);
    opacity:0;
    pointer-events:none;
  }
  /* estado ao sair: fora de cena, à direita */
  .people-layer img.is-hidden-right{
    transform:translateX(25%);
    opacity:0;
    pointer-events:none;
  }

  @media (max-width:720px){
    .content-block{ left:6%; }
    .cta{ font-size:.8rem; }
    .people-layer{ width:65%; }
  }
</style>
</head>
<body>

<div class="hero">

  <div class="speed-lines">
    <div class="speed-row r1"><div class="speed-track">
      <img src="assets/SETAS.png" alt=""><img src="assets/SETAS.png" alt=""><img src="assets/SETAS.png" alt=""><img src="assets/SETAS.png" alt=""><img src="assets/SETAS.png" alt="">
      <img src="assets/SETAS.png" alt=""><img src="assets/SETAS.png" alt=""><img src="assets/SETAS.png" alt=""><img src="assets/SETAS.png" alt=""><img src="assets/SETAS.png" alt="">
    </div></div>
    <div class="speed-row r2"><div class="speed-track">
      <img src="assets/SETAS.png" alt=""><img src="assets/SETAS.png" alt=""><img src="assets/SETAS.png" alt=""><img src="assets/SETAS.png" alt=""><img src="assets/SETAS.png" alt=""><img src="assets/SETAS.png" alt="">
      <img src="assets/SETAS.png" alt=""><img src="assets/SETAS.png" alt=""><img src="assets/SETAS.png" alt=""><img src="assets/SETAS.png" alt=""><img src="assets/SETAS.png" alt=""><img src="assets/SETAS.png" alt="">
    </div></div>
    <div class="speed-row r3"><div class="speed-track">
      <img src="assets/SETAS.png" alt=""><img src="assets/SETAS.png" alt=""><img src="assets/SETAS.png" alt=""><img src="assets/SETAS.png" alt="">
      <img src="assets/SETAS.png" alt=""><img src="assets/SETAS.png" alt=""><img src="assets/SETAS.png" alt=""><img src="assets/SETAS.png" alt="">
    </div></div>
    <div class="speed-row r4"><div class="speed-track">
      <img src="assets/SETAS.png" alt=""><img src="assets/SETAS.png" alt=""><img src="assets/SETAS.png" alt=""><img src="assets/SETAS.png" alt=""><img src="assets/SETAS.png" alt="">
      <img src="assets/SETAS.png" alt=""><img src="assets/SETAS.png" alt=""><img src="assets/SETAS.png" alt=""><img src="assets/SETAS.png" alt=""><img src="assets/SETAS.png" alt="">
    </div></div>
    <div class="speed-row r5"><div class="speed-track">
      <img src="assets/SETAS.png" alt=""><img src="assets/SETAS.png" alt=""><img src="assets/SETAS.png" alt=""><img src="assets/SETAS.png" alt="">
      <img src="assets/SETAS.png" alt=""><img src="assets/SETAS.png" alt=""><img src="assets/SETAS.png" alt=""><img src="assets/SETAS.png" alt="">
  </div>

  <div class="content-block">
    <div class="logo">
      <img src="assets/LOGO_FEIRA.png" alt="Feira do Empreendedor Sebrae">
    </div>

    <div class="headline-img">
      <img src="assets/TEXTO_FEIRA.png" alt="A maior feira do Brasil pra quem faz acontecer - 05 e 06 de novembro">
    </div>

    <a href="#" class="cta" target="_blank" rel="noopener">
      CLIQUE AQUI E FIQUE POR DENTRO
      <span class="arrow">&#8594;</span>
    </a>
  </div>

  <div class="people-layer" id="peopleLayer">
    <img src="assets/PERSONAGENS_01.png" alt="" class="active">
    <img src="assets/PERSONAGENS_02.png" alt="" class="is-hidden-right">
    <img src="assets/PERSONAGENS_03.png" alt="" class="is-hidden-right">
  </div>

</div>

<script>
  const HOLD_MS = 5000;
  const imgs = Array.from(document.querySelectorAll('#peopleLayer img'));
  let current = 0;

  function goTo(nextIndex){
    const curEl = imgs[current];
    const nextEl = imgs[nextIndex];

    // pessoa atual sai pela direita
    curEl.classList.remove('active');
    curEl.classList.add('is-hidden-right');

    // prepara a próxima do lado esquerdo (sem transição) e entra
    nextEl.classList.remove('is-hidden-right');
    nextEl.style.transition = 'none';
    nextEl.classList.add('is-hidden-left');

    requestAnimationFrame(() => {
      nextEl.style.transition = '';
      nextEl.classList.remove('is-hidden-left');
      nextEl.classList.add('active');
    });

    current = nextIndex;
  }

  function cycle(){
    setTimeout(() => {
      const next = (current + 1) % imgs.length;
      goTo(next);
      cycle();
    }, HOLD_MS);
  }

  cycle();
</script>

</body>
</html>
